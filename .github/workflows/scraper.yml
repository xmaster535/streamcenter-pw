name: Auto Update Scraper

on:
  schedule:
    # প্রতি ৫ মিনিট পরপর অটো রান হবে
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য রান বাটন যুক্ত রাখবে

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে ফাইল পুশ করার পারমিশন

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      run: python main.py

    - name: Commit and Push update files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add cache.json live_streams.json playlist.m3u || true
        git commit -m "Auto updated live links [skip ci]" || exit 0
        git push
